services:
  - type: web
    name: prosthetic-investment
    runtime: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails tailwindcss:build
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
      bundle exec rails db:seed
    startCommand: bundle exec rails server -p $PORT -e production
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prosthetic-db
          property: connectionString

databases:
  - name: prosthetic-db
    plan: free
